<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5cb82e">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>아이디 찾기 - 톡벨 (Mobile)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile-app.css">
    <style>
        .find-logo { text-align: center; padding: 28px 0 16px; }
        .find-logo img { height: 30px; }
        .find-desc {
            background: var(--primary-soft);
            border-left: 3px solid var(--primary);
            border-radius: 0 10px 10px 0;
            padding: 12px 14px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .result-box {
            display: none;
            background: var(--primary-soft);
            border: 1.5px solid var(--primary);
            border-radius: 14px;
            padding: 24px 20px;
            text-align: center;
            margin-top: 16px;
        }
        .result-box .r-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .result-box .r-id {
            font-size: 20px; font-weight: 800; color: var(--primary);
            letter-spacing: -0.4px; margin-top: 8px;
        }
        .result-box .r-date { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    </style>
</head>
<body>
    <div class="mobile-frame no-tab">
        <div class="status-bar"><span>9:41</span></div>

        <header class="page-header-bar">
            <div class="inner">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <a href="login-mobile.html" class="back-btn" aria-label="뒤로">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <div class="title-wrap">
                    <div class="title">아이디 찾기</div>
                </div>
                <a href="login-mobile.html" class="icon-btn profile-btn" aria-label="로그인">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                </a>
            </div>
        </header>

        <main class="page-content">
            <div class="find-logo">
                <img src="../img/logo/tokbell_logo_o.png" alt="tokbell" width="120" height="30">
            </div>

            <div class="find-desc">
                본인인증을 진행하시면 가입 시 등록한 아이디(이메일)를 확인할 수 있습니다.
            </div>

            <div class="card">
                <div class="card-title" style="margin-bottom:20px;">본인 정보 입력</div>

                <div class="form-group">
                    <label class="form-label required">이름</label>
                    <input type="text" class="form-input" placeholder="가입 시 등록한 이름" id="nameInput">
                </div>

                <div class="form-group">
                    <label class="form-label required">생년월일</label>
                    <input type="text" class="form-input" placeholder="예) 19901231" id="birthInput" maxlength="8" inputmode="numeric">
                    <div class="form-help">8자리 숫자로 입력해 주세요. (예: 19901231)</div>
                </div>

                <div class="form-group" style="margin-bottom:20px;">
                    <label class="form-label required">휴대폰 번호</label>
                    <input type="tel" class="form-input" placeholder="010-0000-0000" id="phoneInput">
                    <div class="form-help">가입 시 등록한 휴대폰 번호를 입력해 주세요.</div>
                </div>

                <button class="btn btn-primary btn-block" id="verifyBtn" style="height:52px;font-size:15px;">본인인증하기</button>

                <!-- 결과 -->
                <div class="result-box" id="resultBox">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" width="36" height="36" style="margin-bottom:8px;"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
                    <div class="r-label">회원님의 아이디(이메일)</div>
                    <div class="r-id" id="resultId">jhcho5784@naver.com</div>
                    <div class="r-date" id="resultDate">가입일: 2024-01-08</div>
                    <div style="margin-top:16px;display:flex;gap:8px;">
                        <a href="login-mobile.html" class="btn btn-primary" style="flex:1;">로그인</a>
                        <a href="find-password-mobile.html" class="btn btn-outline" style="flex:1;">비밀번호 찾기</a>
                    </div>
                </div>
            </div>

            <div class="btn-row" style="margin-top:16px;">
                <a href="login-mobile.html" class="btn btn-outline" style="flex:1;">로그인</a>
                <a href="signup-mobile.html" class="btn btn-outline" style="flex:1;">회원가입</a>
            </div>

            <div class="alert alert-info" style="margin-top:16px;">
                💡 아이디를 찾지 못하셨나요?
                <a href="support-inquiry-mobile.html" style="color:var(--primary);font-weight:700;text-decoration:none;">1:1 문의하기 →</a>
            </div>
        </main>
    </div>

    <div id="drawerWrap"></div>
    <script src="js/mobile-app.js"></script>
    <script>
        document.getElementById('drawerWrap').innerHTML = renderDrawer();
        initMobileDrawer();

        // 생년월일 숫자만 입력
        document.getElementById('birthInput').addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);
        });

        document.getElementById('verifyBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim();
            const birth = document.getElementById('birthInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();

            if (!name) { alert('이름을 입력해 주세요.'); return; }
            if (birth.length !== 8) { alert('생년월일 8자리를 입력해 주세요.\n예) 19901231'); return; }
            if (!phone) { alert('휴대폰 번호를 입력해 주세요.'); return; }

            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = '';
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
    </script>
</body>
</html>
