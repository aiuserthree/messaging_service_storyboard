<!DOCTYPE html>

    <meta charset="UTF-8">

    <meta name="theme-color" content="#5cb82e">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>문자 발송 - 톡벨 (Mobile)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile-app.css">
    <style>
        .type-tabs { display: flex; gap: 0; background: #fff; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
        .type-tabs::-webkit-scrollbar { display: none; }
        .type-tab {
            flex: 1; min-width: max-content; padding: 12px 16px; border: none; background: none;
            font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer;
            border-bottom: 2px solid transparent; white-space: nowrap;
        }
        .type-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .recipient-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .recipient-count { font-size: 13px; color: var(--text-sub); margin-bottom: 10px; }
        .recipient-count strong { color: var(--primary); }
        .recipient-list { max-height: 160px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; }
        .recipient-row {
            display: flex; align-items: center; gap: 10px; padding: 10px 12px;
            border-bottom: 1px solid var(--border); font-size: 13px;
        }
        .recipient-row:last-child { border-bottom: none; }
        .var-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .var-btns button { padding: 6px 10px; font-size: 11px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; color: var(--primary); }
        .byte-counter { text-align: right; font-size: 12px; color: var(--text-muted); margin-top: 6px; }
        .msg-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .bottom-action { bottom: calc(72px + env(safe-area-inset-bottom)); }
    </style>
</head>

    <script src="js/mobile-app.js"></script>
    <script>
        document.getElementById('tabBar').innerHTML = renderTabBar('send');
        document.getElementById('drawerWrap').innerHTML = renderDrawer();
        initMobileDrawer();

        const msgContent = document.getElementById('messageContent');
        const byteCounter = document.getElementById('byteCounter');
        const previewBubble = document.getElementById('previewBubble');
        const previewCaller = document.getElementById('previewCaller');
        const callerSelect = document.getElementById('callerNumber');
        const titleGroup = document.getElementById('titleGroup');
        const costUnit = document.getElementById('costUnit');
        const costTotal = document.getElementById('costTotal');
        const prices = { SMS: 8.3, LMS: 26.5, MMS: 59 };
        let count = 2;

        function getByteLength(str) {
            let len = 0;
            for (let i = 0; i < str.length; i++) {
                len += str.charCodeAt(i) > 127 ? 2 : 1;
            }
            return len;
        }

        function insertVar(v) {
            const start = msgContent.selectionStart;
            const end = msgContent.selectionEnd;
            const text = msgContent.value;
            msgContent.value = text.slice(0, start) + v + text.slice(end);
            msgContent.focus();
            updatePreview();
        }

        function updatePreview() {
            const bytes = getByteLength(msgContent.value);
            const type = document.querySelector('input[name="msgType"]:checked').value;
            const max = type === 'SMS' ? 90 : 2000;
            byteCounter.textContent = bytes + ' / ' + max + ' 바이트';
            previewBubble.textContent = msgContent.value || '메시지 내용을 입력하세요';
            if (type !== 'SMS') titleGroup.style.display = 'block';
            else titleGroup.style.display = 'none';
            costUnit.textContent = prices[type] + 'P';
            costTotal.textContent = (prices[type] * count).toFixed(1) + 'P';
        }

        callerSelect.addEventListener('change', () => {
            previewCaller.textContent = callerSelect.value || '발신번호를 선택하세요';
        });

        document.querySelectorAll('input[name="msgType"]').forEach(r => r.addEventListener('change', updatePreview));
        document.querySelectorAll('input[name="sendTime"]').forEach(r => {
            r.addEventListener('change', () => {
                document.getElementById('reserveTime').style.display = r.value === 'reserve' ? 'block' : 'none';
            });
        });

        document.querySelectorAll('.type-tab').forEach((tab, i) => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });

        // 발송 → 알림톡 추가 인증 후 실행
        document.getElementById('sendBtn').addEventListener('click', () => {
            if (!callerSelect.value) { alert('발신번호를 선택해주세요.'); return; }
            if (!msgContent.value.trim()) { alert('메시지 내용을 입력해주세요.'); return; }
            openAlimtalkAuth({
                title: '발송 추가 인증',
                description: '발송 전 확인을 위해 등록된 휴대폰 번호로 카카오톡 알림톡을 보내드립니다.',
                confirmText: '인증하고 발송하기',
                onSuccess: () => { location.href = 'send-complete-mobile.html?total=1500&fail=13'; }
            });
        });

        updatePreview();
    </script>
