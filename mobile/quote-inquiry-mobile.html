<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5cb82e">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>견적 문의 - 톡벨 (Mobile)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile-app.css">
</head>
<body>
    <div class="mobile-frame no-tab">
        <div class="status-bar"><span>9:41</span></div>
        <header class="page-header-bar">
            <div class="inner">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <a href="support-center-mobile.html" class="back-btn" aria-label="뒤로">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <div class="title-wrap">
                    <div class="title">견적 문의</div>
                    <div class="subtitle">대량 발송 상담</div>
                </div>
                <a href="mypage-mobile.html" class="icon-btn profile-btn" aria-label="프로필">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
                </a>
            </div>
        </header>

        <main class="page-content">
            <div class="support-hero" style="margin:-16px -16px 16px;">
                <h2>대량 발송 견적 상담</h2>
                <p>월 1만건 이상 발송 예정이시면<br>맞춤 견적을 받아보세요.</p>
            </div>

            <section class="card">
                <div class="card-title">기업 정보</div>
                <div class="form-group">
                    <label class="form-label required">회사명</label>
                    <input type="text" class="form-input" placeholder="회사명을 입력하세요">
                </div>
                <div class="form-group">
                    <label class="form-label required">담당자명</label>
                    <input type="text" class="form-input" placeholder="담당자명">
                </div>
                <div class="form-group">
                    <label class="form-label required">연락처</label>
                    <input type="tel" class="form-input" placeholder="010-0000-0000">
                </div>
                <div class="form-group">
                    <label class="form-label required">이메일</label>
                    <input type="email" class="form-input" placeholder="example@company.com">
                </div>
            </section>

            <section class="card">
                <div class="card-title">발송 정보</div>
                <div class="form-group">
                    <label class="form-label required">예상 월 발송량</label>
                    <select class="form-select">
                        <option>1만 ~ 5만건</option>
                        <option>5만 ~ 10만건</option>
                        <option>10만 ~ 50만건</option>
                        <option>50만건 이상</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label required">메시지 유형</label>
                    <div class="check-row" style="flex-direction:column;align-items:flex-start;gap:8px;">
                        <label class="radio-chip"><input type="checkbox" checked> SMS/LMS/MMS</label>
                        <label class="radio-chip"><input type="checkbox"> 알림톡</label>
                        <label class="radio-chip"><input type="checkbox"> 브랜드 메시지</label>
                        <label class="radio-chip"><input type="checkbox"> 광고/선거 문자</label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">문의 내용</label>
                    <textarea class="form-textarea" rows="4" placeholder="추가 문의사항을 입력해 주세요"></textarea>
                </div>
                <div class="form-group">
                    <label class="check-row"><input type="checkbox" id="quoteAgree"> 개인정보 수집·이용에 동의합니다</label>
                </div>
                <button class="btn btn-primary btn-block" id="quoteSubmit">견적 문의 접수</button>
            </section>
        </main>
    </div>
    <div id="drawerWrap"></div>
    <script src="js/mobile-app.js"></script>
    <script>
        document.getElementById('drawerWrap').innerHTML = renderDrawer();
        initMobileDrawer();
    </script>
    <script>
        document.getElementById('quoteSubmit').addEventListener('click', () => {
            if (!document.getElementById('quoteAgree').checked) {
                alert('개인정보 수집·이용에 동의해 주세요.');
                return;
            }
            alert('견적 문의가 접수되었습니다. (UI 목업)');
        });
    </script>
</body>
</html>
