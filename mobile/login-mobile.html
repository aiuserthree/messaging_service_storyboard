<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5cb82e">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>로그인 - 톡벨 (Mobile)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile-app.css">
</head>
<body>
    <div class="mobile-frame no-tab">
        <div class="status-bar"><span>9:41</span></div>

        <header class="page-header-bar">
            <div class="inner">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <a href="index-mobile.html" class="back-btn" aria-label="홈">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <div class="title-wrap">
                    <div class="title">로그인</div>
                </div>
                <a href="signup-mobile.html" class="icon-btn profile-btn" aria-label="회원가입" style="font-size:11px;font-weight:700;color:var(--primary);width:auto;padding:0 10px;">
                    가입
                </a>
            </div>
        </header>

        <main class="page-content" style="padding-top:8px;">
            <div class="login-logo">
                <img src="../img/logo/tokbell_logo_o.png" alt="tokbell" width="140" height="32">
            </div>

            <div class="login-card">
                <div class="form-group" id="loginIdGroup">
                    <label class="form-label">아이디 (이메일)</label>
                    <input type="email" class="form-input" placeholder="이메일을 입력하세요" id="loginId">
                </div>
                <div class="form-group" id="loginPwGroup">
                    <label class="form-label">비밀번호</label>
                    <input type="password" class="form-input" placeholder="비밀번호를 입력하세요" id="loginPw">
                </div>
                <label class="check-row" style="margin-bottom:20px;">
                    <input type="checkbox" id="rememberMe"> 로그인 상태 유지
                </label>
                <button class="btn btn-primary btn-block" id="loginBtn">로그인</button>
            </div>

            <div class="login-links">
                <a href="find-id-mobile.html">아이디 찾기</a>
                <a href="find-password-mobile.html">비밀번호 찾기</a>
                <a href="signup-mobile.html" class="primary">회원가입</a>
            </div>

            <div style="margin-top:32px;text-align:center;">
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">소셜 계정으로 시작하기</div>
                <div class="btn-row" style="justify-content:center;">
                    <button class="btn btn-outline" style="flex:1;max-width:100px;">카카오</button>
                    <button class="btn btn-outline" style="flex:1;max-width:100px;">네이버</button>
                    <button class="btn btn-outline" style="flex:1;max-width:100px;">Google</button>
                </div>
            </div>
        </main>
    </div>

    <div id="drawerWrap"></div>
    <script src="js/mobile-app.js"></script>
    <script>
        document.getElementById('drawerWrap').innerHTML = renderDrawer();
        initMobileDrawer();
        // 로그인 → 2차 인증 진입
        document.getElementById('loginBtn').addEventListener('click', () => {
            const id = document.getElementById('loginId').value.trim();
            const pw = document.getElementById('loginPw').value.trim();
            if (!id || !pw) { alert('아이디와 비밀번호를 입력해 주세요.'); return; }
            openAlimtalkAuth({
                title: '2차 인증',
                description: '보안을 위해 등록된 휴대폰 번호로 카카오톡 알림톡을 보내드립니다.',
                onSuccess: () => { location.href = 'main-mobile.html'; }
            });
        });
    </script>

    <!-- 화면설계 오버레이 -->
    <script src="../js/spec-overlay.js"></script>
    <script>
        const specData = [
            // ===== 헤더 =====
            {
                selector: '#menuBtn',
                title: '햄버거 메뉴 버튼',
                position: { top: '-6px', left: '-6px' },
                function: '전체 메뉴 드로어 열기',
                behavior: [
                    '클릭 시 좌측에서 드로어 슬라이드인 + 배경 딤 처리',
                    '드로어 메뉴는 mobile-app.js 의 renderDrawer() 공용 함수로 생성',
                    '배경 딤 탭 또는 드로어 내 닫기로 종료'
                ],
                tags: [{ text: '공통', type: 'info' }]
            },
            {
                selector: '.page-header-bar .back-btn',
                title: '홈 이동 버튼',
                position: { top: '-6px', left: '-6px' },
                function: 'index-mobile.html(랜딩)로 이동'
            },
            {
                selector: '.page-header-bar .profile-btn',
                title: '가입 바로가기',
                position: { top: '-6px', right: '-6px' },
                function: 'signup-mobile.html(회원가입)로 이동'
            },

            // ===== 로그인 폼 =====
            {
                selector: '.login-logo',
                title: '브랜드 로고',
                position: { top: '0px', left: '0px' },
                function: 'tokbell 로고 노출 (../img/logo/tokbell_logo_o.png)'
            },
            {
                selector: '#loginIdGroup',
                title: '아이디 (이메일) 입력',
                position: { top: '-6px', left: '-6px' },
                function: '로그인 아이디 입력 — 이메일 형식',
                behavior: [
                    'type="email" — 모바일에서 이메일 키패드 노출',
                    '미입력 시 "아이디와 비밀번호를 입력해 주세요." 얼럿',
                    '프로토타입: 형식 검증만 수행하며 계정 대조는 없음'
                ],
                api: 'POST /api/auth/login',
                tags: [{ text: '필수', type: 'required' }]
            },
            {

                behavior: [
                    'type="password" — 입력값 마스킹',
                    '미입력 시 "아이디와 비밀번호를 입력해 주세요." 얼럿'
                ],
                tags: [{ text: '필수', type: 'required' }]
            },
            {
                selector: '.check-row',
                title: '로그인 상태 유지',
                position: { top: '-6px', left: '-6px' },
                function: '체크 시 로그인 상태 유지',
                behavior: ['프로토타입: 체크 상태만 표시하며 저장 동작은 미구현']
            },
            {
                selector: '#loginBtn',
                title: '로그인 버튼',
                position: { top: '-6px', right: '-6px' },
                function: '입력값 검증 후 2차 인증(알림톡) 진입',
                behavior: [
                    '아이디·비밀번호 중 하나라도 비어 있으면 얼럿 후 중단',
                    '검증 통과 시 openAlimtalkAuth() 호출 → 2차 인증 바텀시트 노출',
                    '인증 성공 시에만 main-mobile.html 로 이동'
                ],
                api: 'POST /api/auth/login',
                tags: [{ text: '필수', type: 'required' }, { text: 'API', type: 'api' }]
            },

            // ===== 보조 링크 =====
            {
                selector: '.login-links',
                title: '보조 링크 영역',
                position: { top: '-6px', left: '-6px' },
                function: '계정 찾기 · 회원가입 진입',
                behavior: [
                    '아이디 찾기 → find-id-mobile.html',
                    '비밀번호 찾기 → find-password-mobile.html',
                    '회원가입 → signup-mobile.html'
                ]
            },
            {
                selector: '.btn-row',
                title: '소셜 로그인',
                position: { top: '-6px', left: '-6px' },
                function: '카카오 · 네이버 · Google 간편 로그인',
                behavior: ['프로토타입: 버튼만 배치되어 있으며 연동 동작은 미구현'],
                tags: [{ text: '준비중', type: 'info' }]
            },

            // ===== 2차 인증 =====
            {
                selector: '#atkSheet',
                title: '2차 인증 바텀시트 (알림톡)',
                position: { top: '10px', left: '10px' },
                function: '로그인 후 다중인증(MFA) 수행 — 카카오톡 알림톡 인증번호',
                behavior: [
                    '아이디·비밀번호 입력 후 "로그인" 클릭 시 하단에서 슬라이드업',
                    '1단계: 휴대폰 번호 입력 → 알림톡으로 인증번호 6자리 발송',
                    '2단계: 인증번호 입력 (유효시간 3분, 만료 시 재전송 활성화)',
                    '카카오톡 미사용·수신 불가 시 문자(SMS) 대체 발송 제공',
                    '【실패 처리】',
                    '자릿수 미달: "인증번호 6자리를 입력해주세요."',
                    '불일치: "인증번호가 일치하지 않습니다. (n/5회)" — 남은 시도 횟수 표시',
                    '5회 초과 또는 유효시간 만료: 입력·인증 버튼 잠금, 재전송해야 재시도 가능',
                    '재전송 시 입력값·오류 문구·시도 횟수 초기화',
                    '배경 탭·취소·ESC로 닫기 → 1단계로 초기화',
                    '인증 완료 시 main-mobile.html로 이동'
                ],
                api: 'POST /api/auth/mfa/send, POST /api/auth/mfa/verify',
                tags: [{ text: '모달', type: 'info' }, { text: '필수', type: 'required' }, { text: 'API', type: 'api' }]
            }
        ];
        // 오버레이는 첫 토글 때 마커를 만든다 — 인증 시트를 미리 DOM 에 올려 마커 누락을 막는다
        renderAlimtalkAuthSheet();
        initSpecOverlay(specData);
    </script>
</body>
</html>
