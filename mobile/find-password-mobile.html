<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5cb82e">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>비밀번호 찾기 - 톡벨 (Mobile)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile-app.css">
    <style>
        .find-logo { text-align: center; padding: 28px 0 16px; }
        .find-logo img { height: 30px; }
        .find-desc {
            background: var(--primary-soft);
            border-left: 3px solid var(--primary);
            border-radius: 0 10px 10px 0;
            padding: 12px 14px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        /* 숨김 구역 — 순차 노출 */
        .reveal-section { display: none; }
        .reveal-section.visible { display: block; }
        /* 인증번호 타이머 */
        .code-row { display: flex; gap: 8px; align-items: center; }
        .code-timer { font-size: 13px; color: var(--danger); font-weight: 700; white-space: nowrap; }
        /* 발송 완료 안내 */
        .sent-notice {
            display: none;
            font-size: 12px; color: var(--success); font-weight: 600;
            margin-top: 6px;
        }
        .sent-notice.show { display: block; }
        /* 구분선 */
        .section-divider {
            border: none; border-top: 1px dashed var(--border);
            margin: 20px 0;
        }
        /* 비밀번호 강도 */
        .pw-strength {
            height: 4px; border-radius: 2px; background: #e2e8f0;
            overflow: hidden; margin-top: 8px;
        }
        .pw-strength-bar {
            height: 100%; border-radius: 2px; transition: width .3s;
            background: var(--danger); width: 0%;
        }
        .pw-strength-bar.medium { background: var(--warning); }
        .pw-strength-bar.strong { background: var(--success); }
        /* 완료 화면 */
        .complete-box { display: none; text-align: center; padding: 32px 24px; }
        .complete-box.show { display: block; }
        .complete-icon {
            width: 72px; height: 72px; border-radius: 50%;
            background: var(--primary-soft); margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div class="mobile-frame no-tab">
        <div class="status-bar"><span>9:41</span></div>

        <header class="page-header-bar">
            <div class="inner">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <a href="login-mobile.html" class="back-btn" aria-label="뒤로">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <div class="title-wrap">
                    <div class="title">비밀번호 찾기</div>
                </div>
                <a href="login-mobile.html" class="icon-btn profile-btn" aria-label="로그인">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                </a>
            </div>
        </header>

        <main class="page-content">
            <div class="find-logo">
                <img src="../img/logo/tokbell_logo_o.png" alt="tokbell" width="120" height="30">
            </div>

            <div class="find-desc">
                가입 시 등록한 아이디(이메일)로 인증번호를 발송합니다.
            </div>

            <div class="card" id="mainCard">

                <!-- ① 이메일 입력 + 인증번호 발송 -->
                <div class="form-group" style="margin-bottom:0;">
                    <label class="form-label required">아이디 (이메일)</label>
                    <div style="display:flex;gap:8px;">
                        <input type="email" class="form-input" placeholder="example@email.com" id="findEmail" style="flex:1;">
                        <button class="btn btn-outline btn-sm" id="sendCodeBtn" style="white-space:nowrap;">인증번호 발송</button>
                    </div>
                    <div class="sent-notice" id="sentNotice">인증번호가 이메일로 발송되었습니다.</div>
                </div>

                <!-- ② 인증번호 입력 (발송 후 노출) -->
                <div class="reveal-section" id="codeSection">
                    <hr class="section-divider">
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label required">인증번호</label>
                        <div class="code-row">
                            <input type="text" class="form-input" placeholder="6자리 숫자" id="codeInput" maxlength="6" inputmode="numeric" style="flex:1;">
                            <span class="code-timer" id="codeTimer">03:00</span>
                        </div>
                        <div class="form-help">인증번호 유효시간 3분</div>
                    </div>
                    <button class="btn btn-primary btn-block" id="verifyBtn" style="margin-top:16px;">인증하기</button>
                </div>

                <!-- ③ 새 비밀번호 설정 (인증 후 노출) -->
                <div class="reveal-section" id="pwSection">
                    <hr class="section-divider">
                    <div style="font-size:14px;font-weight:700;margin-bottom:16px;">새 비밀번호 설정</div>
                    <div class="form-group">
                        <label class="form-label required">새 비밀번호</label>
                        <input type="password" class="form-input" placeholder="8자 이상, 영문·숫자·특수문자" id="newPw">
                        <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
                        <div class="form-help" id="pwStrengthLabel">비밀번호를 입력하세요</div>
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label class="form-label required">새 비밀번호 확인</label>
                        <input type="password" class="form-input" placeholder="비밀번호 재입력" id="newPwConfirm">
                        <div class="form-help" id="pwMatchLabel"></div>
                    </div>
                    <button class="btn btn-primary btn-block" id="changePwBtn" style="margin-top:20px;height:52px;font-size:15px;">비밀번호 변경</button>
                </div>

            </div>

            <!-- ④ 완료 화면 -->
            <div class="card complete-box" id="completeBox">
                <div class="complete-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.2" stroke-linecap="round" width="36" height="36"><path d="M20 6L9 17l-5-5"/></svg>
                </div>
                <div style="font-size:20px;font-weight:800;margin-bottom:8px;">비밀번호 변경 완료!</div>
                <div style="font-size:13px;color:var(--text-muted);line-height:1.7;margin-bottom:24px;">
                    새 비밀번호로 로그인해 주세요.<br>보안을 위해 다른 기기의 로그인은 자동 해제됩니다.
                </div>
                <a href="login-mobile.html" class="btn btn-primary btn-block" style="height:52px;font-size:15px;">로그인하러 가기</a>
            </div>

            <div class="btn-row" style="margin-top:16px;" id="bottomLinks">
                <a href="find-id-mobile.html" class="btn btn-outline" style="flex:1;">아이디 찾기</a>
                <a href="signup-mobile.html" class="btn btn-outline" style="flex:1;">회원가입</a>
            </div>
        </main>
    </div>

    <div id="drawerWrap"></div>
    <script src="js/mobile-app.js"></script>
    <script>
        document.getElementById('drawerWrap').innerHTML = renderDrawer();
        initMobileDrawer();

        let timerInterval;

        // 타이머 시작
        function startTimer() {
            clearInterval(timerInterval);
            let sec = 180;
            const el = document.getElementById('codeTimer');
            el.textContent = '03:00';
            timerInterval = setInterval(() => {
                sec--;
                el.textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
                if (sec <= 0) { clearInterval(timerInterval); el.textContent = '만료'; }
            }, 1000);
        }

        // ① 인증번호 발송
        document.getElementById('sendCodeBtn').addEventListener('click', () => {
            const email = document.getElementById('findEmail').value.trim();
            if (!email || !email.includes('@')) { alert('아이디(이메일)를 올바르게 입력해 주세요.'); return; }
            document.getElementById('codeSection').classList.add('visible');
            document.getElementById('sentNotice').classList.add('show');
            document.getElementById('sendCodeBtn').textContent = '재발송';
            document.getElementById('codeInput').value = '';
            document.getElementById('codeInput').focus();
            startTimer();
        });

        // ② 인증하기
        document.getElementById('verifyBtn').addEventListener('click', () => {
            const code = document.getElementById('codeInput').value.trim();
            if (code.length !== 6) { alert('인증번호 6자리를 입력해 주세요.'); return; }
            clearInterval(timerInterval);
            document.getElementById('codeSection').style.pointerEvents = 'none';
            document.getElementById('codeSection').style.opacity = '0.5';
            document.getElementById('pwSection').classList.add('visible');
            document.getElementById('newPw').focus();
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        });

        // 비밀번호 강도
        document.getElementById('newPw').addEventListener('input', function () {
            const v = this.value;
            const bar = document.getElementById('pwBar');
            const label = document.getElementById('pwStrengthLabel');
            let s = 0;
            if (v.length >= 8) s++;
            if (/[A-Za-z]/.test(v) && /[0-9]/.test(v)) s++;
            if (/[^A-Za-z0-9]/.test(v)) s++;
            const states = [
                ['0%', '', '비밀번호를 입력하세요'],
                ['33%', '', '약함 — 보안에 취약합니다'],
                ['66%', 'medium', '보통'],
                ['100%', 'strong', '강함 — 안전한 비밀번호입니다'],
            ];
            bar.style.width = states[s][0];
            bar.className = 'pw-strength-bar' + (states[s][1] ? ' ' + states[s][1] : '');
            label.textContent = states[s][2];
        });

        // 비밀번호 일치 확인
        document.getElementById('newPwConfirm').addEventListener('input', function () {
            const pw = document.getElementById('newPw').value;
            const label = document.getElementById('pwMatchLabel');
            if (!this.value) { label.textContent = ''; return; }
            const match = this.value === pw;
            label.textContent = match ? '비밀번호가 일치합니다' : '비밀번호가 일치하지 않습니다';
            label.style.color = match ? 'var(--success)' : 'var(--danger)';
        });

        // ③ 비밀번호 변경
        document.getElementById('changePwBtn').addEventListener('click', () => {
            const pw = document.getElementById('newPw').value;
            const pwc = document.getElementById('newPwConfirm').value;
            if (!pw || pw.length < 8) { alert('비밀번호는 8자 이상이어야 합니다.'); return; }
            if (pw !== pwc) { alert('비밀번호가 일치하지 않습니다.'); return; }
            document.getElementById('mainCard').style.display = 'none';
            document.getElementById('bottomLinks').style.display = 'none';
            document.getElementById('completeBox').classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
