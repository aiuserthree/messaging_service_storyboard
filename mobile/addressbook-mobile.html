<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5cb82e">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>주소록 - 톡벨 (Mobile)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile-app.css">
    <style>
        .group-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
            margin-bottom: 12px; scrollbar-width: none;
        }
        .group-scroll::-webkit-scrollbar { display: none; }
        .group-chip {
            flex-shrink: 0; padding: 10px 14px; border-radius: 12px;
            background: #fff; border: 1px solid var(--border); min-width: 90px;
        }
        .group-chip.active { border-color: var(--primary); background: var(--primary-soft); }
        .group-chip .g-name { font-size: 13px; font-weight: 700; white-space: nowrap; }
        .group-chip .g-count { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .action-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .fab-add {
            position: fixed; bottom: calc(88px + env(safe-area-inset-bottom)); right: calc(50% - 195px);
            width: 52px; height: 52px; border-radius: 50%; background: var(--primary); color: #fff;
            border: none; font-size: 28px; box-shadow: 0 6px 18px rgba(92,184,46,0.45); cursor: pointer; z-index: 45;
        }
        @media (max-width: 460px) { .fab-add { right: 20px; } }
    </style>
</head>
<body>
    <div class="mobile-frame">
        <div class="status-bar"><span>9:41</span></div>

        <header class="page-header-bar">
            <div class="inner">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <a href="main-mobile.html" class="back-btn" aria-label="뒤로">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <div class="title-wrap">
                    <div class="title">주소록</div>
                    <div class="subtitle">그룹별 수신자 관리</div>
                </div>
                <a href="mypage-mobile.html" class="icon-btn profile-btn" aria-label="프로필">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
                </a>
            </div>
        </header>

        <div class="tab-scroll" id="pageTabs">
            <a href="addressbook-mobile.html" class="tab-pill active">주소록 관리</a>
            <a href="#" class="tab-pill">수신거부관리</a>
        </div>

        <main class="page-content">
            <div class="stat-grid cols-4">
                <div class="stat-box"><div class="lbl">전체 주소</div><div class="val primary">1,234</div></div>
                <div class="stat-box"><div class="lbl">그룹 수</div><div class="val">5</div></div>
                <div class="stat-box"><div class="lbl">정상 주소</div><div class="val success">1,200</div></div>
                <div class="stat-box"><div class="lbl">수신거부</div><div class="val danger">34</div></div>
            </div>

            <div class="group-scroll" id="groupScroll">
                <div class="group-chip active" data-group="vip">
                    <div class="g-name">VIP 고객</div>
                    <div class="g-count">234명</div>
                </div>
                <div class="group-chip" data-group="general">
                    <div class="g-name">일반 고객</div>
                    <div class="g-count">1,000명</div>
                </div>
                <div class="group-chip" data-group="new">
                    <div class="g-name">신규 고객</div>
                    <div class="g-count">50명</div>
                </div>
                <div class="group-chip" data-group="promo">
                    <div class="g-name">프로모션</div>
                    <div class="g-count">12,345명</div>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" class="form-input" placeholder="이름 또는 전화번호 검색" id="searchInput">
                <button class="btn btn-primary btn-sm">검색</button>
            </div>

            <div class="action-bar">
                <button class="btn btn-outline btn-sm">엑셀 업로드</button>
                <button class="btn btn-outline btn-sm">그룹이동</button>
                <button class="btn btn-outline btn-sm">문자 보내기</button>
            </div>

            <div class="list-card" id="contactList">
                <div class="list-item" data-name="홍길동">
                    <input type="checkbox">
                    <div class="avatar">홍</div>
                    <div class="info">
                        <div class="name">홍길동</div>
                        <div class="sub">010-1234-5678 · VIP</div>
                    </div>
                    <div class="meta"><span class="badge badge-success">정상</span></div>
                </div>
                <div class="list-item" data-name="김철수">
                    <input type="checkbox">
                    <div class="avatar">김</div>
                    <div class="info">
                        <div class="name">김철수</div>
                        <div class="sub">010-9876-5432 · 일반</div>
                    </div>
                    <div class="meta"><span class="badge badge-success">정상</span></div>
                </div>
                <div class="list-item" data-name="이영희">
                    <input type="checkbox">
                    <div class="avatar">이</div>
                    <div class="info">
                        <div class="name">이영희</div>
                        <div class="sub">010-5555-7777 · 신규</div>
                    </div>
                    <div class="meta"><span class="badge badge-danger">수신거부</span></div>
                </div>
                <div class="list-item" data-name="박지민">
                    <input type="checkbox">
                    <div class="avatar">박</div>
                    <div class="info">
                        <div class="name">박지민</div>
                        <div class="sub">010-3333-4444 · VIP</div>
                    </div>
                    <div class="meta"><span class="badge badge-success">정상</span></div>
                </div>
                <div class="list-item" data-name="최수진">
                    <input type="checkbox">
                    <div class="avatar">최</div>
                    <div class="info">
                        <div class="name">최수진</div>
                        <div class="sub">010-2222-1111 · 일반</div>
                    </div>
                    <div class="meta"><span class="badge badge-success">정상</span></div>
                </div>
            </div>
        </main>

        <button class="fab-add" aria-label="주소 추가" onclick="alert('주소 추가 모달 (UI 목업)')">+</button>

        <nav class="tab-bar" id="tabBar"></nav>
        <div id="drawerWrap"></div>
    </div>

    <script src="js/mobile-app.js"></script>
    <script>
        document.getElementById('tabBar').innerHTML = renderTabBar('addressbook');
        document.getElementById('drawerWrap').innerHTML = renderDrawer();
        initMobileDrawer();

        document.querySelectorAll('.group-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.group-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.trim().toLowerCase();
            document.querySelectorAll('#contactList .list-item').forEach(item => {
                const name = item.dataset.name.toLowerCase();
                item.style.display = !q || name.includes(q) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
