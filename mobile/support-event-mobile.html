<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5cb82e">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>이벤트 - 톡벨 (Mobile)</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/mobile-app.css">
</head>
<body>
    <div class="mobile-frame no-tab">
        <div class="status-bar"><span>9:41</span></div>
        <header class="page-header-bar">
            <div class="inner">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="메뉴">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <a href="support-center-mobile.html" class="back-btn" aria-label="뒤로">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                </a>
                <div class="title-wrap">
                    <div class="title">이벤트</div>
                    <div class="subtitle">진행 중인 혜택</div>
                </div>
                <a href="mypage-mobile.html" class="icon-btn profile-btn" aria-label="프로필">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="22" height="22"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
                </a>
            </div>
        </header>

        <nav class="support-tabs" id="supportTabsNav"></nav>

        <div class="tab-scroll" id="eventTabs" style="margin:0;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);">
            <button class="tab-pill active" data-panel="ongoing">진행중</button>
            <button class="tab-pill" data-panel="ended">종료</button>
        </div>

        <main class="page-content">
            <div data-tab-panel="ongoing">
                <a href="support-event-detail-mobile.html?id=1" class="event-card-m">
                    <div class="banner b1">🎁 첫 충전 10% 적립</div>
                    <div class="body">
                        <h4>신규 회원 첫 충전 이벤트</h4>
                        <p>충전 금액의 10%를 추가 적립 + 톡벨커피 쿠폰</p>
                        <div class="date">2026.01.01 ~ 상시 진행</div>
                    </div>
                </a>
                <a href="support-event-detail-mobile.html?id=2" class="event-card-m">
                    <div class="banner b2">📨 대량발송 보상</div>
                    <div class="body">
                        <h4>대량 발송 고객 특별 보상</h4>
                        <p>월 10만건 이상 발송 시 최대 50만원 상품권</p>
                        <div class="date">2026.03.01 ~ 2026.06.30</div>
                    </div>
                </a>
                <a href="support-event-detail-mobile.html?id=3" class="event-card-m">
                    <div class="banner b3">⭐ 마일리지 10%</div>
                    <div class="body">
                        <h4>첫 발송 마일리지 적립</h4>
                        <p>첫 발송 완료 시 보너스 마일리지 적립</p>
                        <div class="date">2026.01.01 ~ 상시 진행</div>
                    </div>
                </a>
            </div>

            <div data-tab-panel="ended" style="display:none;">
                <div class="card" style="text-align:center;padding:40px 20px;color:var(--text-muted);">
                    <div style="font-size:32px;margin-bottom:12px;">📭</div>
                    <div style="font-weight:600;">종료된 이벤트가 없습니다</div>
                </div>
            </div>
        </main>
    </div>
    <div id="drawerWrap"></div>
    <script src="js/mobile-app.js"></script>
    <script>
        document.getElementById('drawerWrap').innerHTML = renderDrawer();
        initMobileDrawer();
        document.getElementById('supportTabsNav').innerHTML = renderSupportTabs('event');
        initTabPills(document.getElementById('eventTabs'));
    </script>
</body>
</html>
